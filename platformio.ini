; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = nano_esp32
extra_configs = secrets.ini

[env:nano_esp32]
platform = espressif32
board = arduino_nano_esp32
framework = arduino
monitor_speed = 9600
build_flags =
	-DOTA_PASSWORD=\"${secrets.ota_password}\"
	; Optional overrides, see the defaults in src/main.cpp
	; -DMQTT_TOPIC=\"iot/flipdisc\"
	; -DMQTT_HOLD_MS=10000
	; -DTIMEZONE=\"PST8PDT,M3.2.0,M11.1.0\"
extra_scripts =
	pre:scripts/git_version.py
lib_deps =
	https://github.com/marcinsaj/FlipDisc.git#v1.1.3
	https://github.com/marcinsaj/RTC_RX8025T.git#v1.0.7
	paulstoffregen/Time@^1.6.1
	mathertel/OneButton@^2.6.2
	adafruit/Adafruit Unified Sensor@^1.1.15
	adafruit/DHT sensor library@^1.4.7
	cyijun/ESP32MQTTClient@^1.1.5

; Upload over WiFi: pio run -e ota -t upload
[env:ota]
extends = env:nano_esp32
upload_protocol = espota
upload_port = flipdisc.smittn.com
upload_flags =
	--auth=${secrets.ota_password}
